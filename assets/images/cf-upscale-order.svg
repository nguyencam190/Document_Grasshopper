<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="dm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F2F2F2"/><stop offset="55%" stop-color="#9A9A9A"/><stop offset="100%" stop-color="#2A2A2A"/></linearGradient>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA3B8"/></marker>
<pattern id="spk" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFF" opacity="0.55"/><circle cx="6" cy="6" r="0.9" fill="#000" opacity="0.5"/></pattern>
</defs>
<rect width="980" height="430" fill="#22262B"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#E8EAED">Upscale TRƯỚC hay SAU khi làm depth map?</text>

<!-- ===== LANE SAI ===== -->
<rect x="24" y="52" width="932" height="156" rx="12" fill="#EF4444" fill-opacity="0.07" stroke="#EF4444" stroke-opacity="0.5" stroke-dasharray="6 5"/>
<text x="42" y="76" font-size="12.5" font-weight="700" fill="#FF8A8A">✕  SAI — phóng ẢNH GỐC lên 4K rồi mới làm depth</text>

<rect x="48" y="90" width="86" height="100" rx="6" fill="#4A4A4A" stroke="#141414"/>
<text x="91" y="128" font-size="10" fill="#DDD" text-anchor="middle">ảnh gốc</text><text x="91" y="144" font-size="10" fill="#DDD" text-anchor="middle">1024</text>
<path d="M140,140 L176,140" stroke="#8FA3B8" stroke-width="2" marker-end="url(#a4)"/>
<rect x="182" y="98" width="130" height="84" rx="6" fill="#303030" stroke="#EF4444" stroke-width="1.8"/>
<text x="247" y="130" font-size="10.5" fill="#FF9A9A" text-anchor="middle">Upscale AI ×4</text><text x="247" y="148" font-size="10" fill="#B7BCC2" text-anchor="middle">→ 4096</text>
<path d="M318,140 L354,140" stroke="#8FA3B8" stroke-width="2" marker-end="url(#a4)"/>
<rect x="360" y="98" width="130" height="84" rx="6" fill="#303030" stroke="#141414" stroke-width="1.8"/>
<text x="425" y="126" font-size="10.5" fill="#DDD" text-anchor="middle">Depth Anything</text><text x="425" y="144" font-size="10" fill="#FF9A9A" text-anchor="middle">buộc phải CHIA TILE</text>
<path d="M496,140 L532,140" stroke="#8FA3B8" stroke-width="2" marker-end="url(#a4)"/>

<!-- bad result -->
<g><rect x="538" y="86" width="150" height="108" rx="4" fill="url(#dm)"/>
<rect x="538" y="86" width="150" height="108" fill="url(#spk)"/>
<line x1="588" y1="86" x2="588" y2="194" stroke="#111" stroke-width="2.4" opacity="0.75"/>
<line x1="638" y1="86" x2="638" y2="194" stroke="#FFF" stroke-width="2.4" opacity="0.7"/>
<line x1="538" y1="140" x2="688" y2="140" stroke="#111" stroke-width="2.4" opacity="0.75"/>
<rect x="538" y="86" width="150" height="108" rx="4" fill="none" stroke="#EF4444" stroke-width="2"/></g>
<text x="706" y="106" font-size="10.5" font-weight="600" fill="#FF9A9A">Vết nối tile</text>
<text x="706" y="122" font-size="9.5" fill="#D8B0B0">bậc thang thẳng tắp chạy ngang/dọc</text>
<text x="706" y="142" font-size="10.5" font-weight="600" fill="#FF9A9A">Chi tiết bịa + halo</text>
<text x="706" y="158" font-size="9.5" fill="#D8B0B0">lấm tấm → dao rung, gỗ sần</text>
<text x="706" y="178" font-size="9.5" fill="#D8B0B0">Chậm 8–16 lần, dễ tràn VRAM</text>

<!-- ===== LANE ĐÚNG ===== -->
<rect x="24" y="228" width="932" height="156" rx="12" fill="#22C55E" fill-opacity="0.06" stroke="#22C55E" stroke-opacity="0.5" stroke-dasharray="6 5"/>
<text x="42" y="252" font-size="12.5" font-weight="700" fill="#7FDCA4">✓  ĐÚNG — làm depth ở 1024 rồi phóng DEPTH MAP lên 4K</text>

<rect x="48" y="266" width="86" height="100" rx="6" fill="#4A4A4A" stroke="#141414"/>
<text x="91" y="304" font-size="10" fill="#DDD" text-anchor="middle">ảnh gốc</text><text x="91" y="320" font-size="10" fill="#DDD" text-anchor="middle">1024</text>
<path d="M140,316 L176,316" stroke="#8FA3B8" stroke-width="2" marker-end="url(#a4)"/>
<rect x="182" y="274" width="130" height="84" rx="6" fill="#303030" stroke="#141414" stroke-width="1.8"/>
<text x="247" y="302" font-size="10.5" fill="#DDD" text-anchor="middle">Depth Anything</text><text x="247" y="320" font-size="10" fill="#7FDCA4" text-anchor="middle">1 tile duy nhất</text>
<path d="M318,316 L354,316" stroke="#8FA3B8" stroke-width="2" marker-end="url(#a4)"/>
<rect x="360" y="274" width="130" height="84" rx="6" fill="#303030" stroke="#4ADE80" stroke-width="1.8"/>
<text x="425" y="302" font-size="10.5" fill="#B7F3CD" text-anchor="middle">Image Scale</text><text x="425" y="320" font-size="10" fill="#7FDCA4" text-anchor="middle">LANCZOS → 4096</text>
<path d="M496,316 L532,316" stroke="#8FA3B8" stroke-width="2" marker-end="url(#a4)"/>

<g><rect x="538" y="262" width="150" height="108" rx="4" fill="url(#dm)"/>
<rect x="538" y="262" width="150" height="108" rx="4" fill="none" stroke="#4ADE80" stroke-width="2"/></g>
<text x="706" y="282" font-size="10.5" font-weight="600" fill="#7FDCA4">Không vết nối, không nhiễu</text>
<text x="706" y="298" font-size="9.5" fill="#AEDCC0">một thang độ sâu duy nhất cho cả ảnh</text>
<text x="706" y="318" font-size="10.5" font-weight="600" fill="#7FDCA4">Không chi tiết bịa</text>
<text x="706" y="334" font-size="9.5" fill="#AEDCC0">Lanczos là nội suy toán học thuần</text>
<text x="706" y="354" font-size="9.5" fill="#AEDCC0">Nhanh, nhẹ VRAM, chạy tốt trên 6GB</text>

<!-- proof -->
<rect x="24" y="396" width="932" height="24" rx="6" fill="#191C20" stroke="#3A4149"/>
<text x="40" y="412" font-size="10.5" fill="#FFD08A">Phôi 400mm ÷ bán kính dao 1.5875mm = 252 chi tiết  →  Nyquist cần ~504 px. Depth ở 1024 đã DƯ GẤP ĐÔI — phóng ảnh gốc lên 4K chỉ tạo ra chi tiết mà Morphology close sẽ xoá sạch.</text>
</svg>
