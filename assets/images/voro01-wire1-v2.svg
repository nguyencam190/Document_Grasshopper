<text x="16" y="330" font-family="Segoe UI" font-size="11" fill="#666">XY Plane → Circle (Radius 8) → Divide Curve (17 điểm quanh vòng) → Line: Start và End cùng 17 điểm, input End bật GRAFT ⌃ → nối MỌI cặp điểm = mạng dây cung (string art). Lấy điểm gieo: Curve Middle (trung điểm mỗi dây) + Divide Curve (4) → Cull Duplicates (bỏ trùng). Cả 2 nguồn Flatten ↓ vào Voronoi (Plane = XY). (Trong file: Circle đi qua 1 Curve param; 2 nguồn điểm đi qua 2 Relay — node truyền dây, không đổi dữ liệu.)</text>
