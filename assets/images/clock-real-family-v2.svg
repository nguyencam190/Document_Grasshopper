<text x="16" y="368" font-family="Segoe UI" font-size="11" fill="#666">Interpolate → ArrPolar (Plane XZ, Count 24, Angle 360°) = họ A → Mirror = họ B. Hai Circle đồng tâm (Radius 16 ngoài + 2.5 trong) → Boundary Surfaces = đĩa vành khăn. SrfSplit cắt đĩa bằng 2 họ spiral → Deconstruct Brep (E) → Join = các ô lens kín.</text>
