<!-- NOTE PANEL -->
<rect x="700" y="556" width="416" height="222" rx="10" fill="#191C20" stroke="#3A4149"/>
<text x="716" y="580" font-size="12" font-weight="700" fill="#FFB74D">3 node viền cam — bỏ 1 cái là hỏng</text>
<text x="716" y="606" font-size="11" font-weight="600" fill="#FFE3B3">Image Scale · 1024 (hàng 1)</text>
<text x="716" y="622" font-size="10" fill="#B9BFC6">Hạ ảnh về 1024 TRƯỚC khi vào depth. Chạy ở 4K</text>
<text x="716" y="636" font-size="10" fill="#B9BFC6">sẽ bị chia tile → bậc thang chạy ngang tác phẩm.</text>
<text x="716" y="662" font-size="11" font-weight="600" fill="#FFE3B3">RemapDepth · min 0 max 1 clamp ON</text>
<text x="716" y="678" font-size="10" fill="#B9BFC6">Trải dữ liệu ra hết dải. Bỏ bước này = bẫy</text>
<text x="716" y="692" font-size="10" fill="#B9BFC6">&quot;16-bit giả&quot;, gỗ vẫn bị vân bậc thang.</text>
