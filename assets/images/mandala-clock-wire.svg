<text x="16" y="330" font-family="Segoe UI" font-size="11" fill="#666">Interpolate (1 cánh heart) → Offset Curve (gân kép) → theo Series vòng: Scale (to dần s_i) · Move (bán kính r_i) · Rotate (lệch nửa bước θ_i) → Polar Array (Count 16) → Graft/Flatten gộp mọi cánh → Boundary Surfaces (mặt gỗ có lỗ) → Extrude 2 lớp + lỗ tâm → Custom Preview. KHÔNG dùng Maelstrom (mandala đối xứng, không xoắn). Sơ đồ SUY LUẬN từ ảnh — chưa kiểm chứng bằng file.</text>
