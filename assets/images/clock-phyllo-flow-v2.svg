<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Segoe UI, sans-serif">
<defs>
<linearGradient id="ghBody" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#F0F0F0"/><stop offset="100%" stop-color="#D8D8D8"/>
</linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="1" fill="#E0E0DA"/>
</pattern>
</defs>

<rect x="0" y="0" width="1180" height="360" fill="#FAFAF7"/>
<rect x="0" y="0" width="1180" height="360" fill="url(#dots)"/>
<text x="16" y="24" font-size="14" font-weight="600" fill="#333">Sơ đồ luồng dựng — Đồng hồ lưới xoắn phyllotaxis (2 họ spiral — đã kiểm chứng)</text>
<rect x="30" y="40" width="340" height="96" rx="9" fill="#EAF2FB" stroke="#4A78C8" stroke-width="1.6"/>
<text x="200.0" y="64" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="700" fill="#1f3a63">1 · Vẽ 1 spiral gốc</text>
<text x="200.0" y="84" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">Range → Expression (r, θ)</text>
<text x="200.0" y="99" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ Construct Point → Rotate</text>
<text x="200.0" y="114" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ Interpolate = 1 spiral</text>
<rect x="420" y="40" width="340" height="96" rx="9" fill="#EAF2FB" stroke="#4A78C8" stroke-width="1.6"/>
<text x="590.0" y="64" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="700" fill="#1f3a63">2 · Polar Array → họ A</text>
<text x="590.0" y="84" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">Polar Array S bản quanh tâm</text>
<text x="590.0" y="99" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">(S = số họ, vd 30)</text>
<text x="590.0" y="114" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ họ spiral thứ nhất</text>
<rect x="810" y="40" width="340" height="96" rx="9" fill="#EAF2FB" stroke="#4A78C8" stroke-width="1.6"/>
<text x="980.0" y="64" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="700" fill="#1f3a63">3 · Mirror → họ B</text>
<text x="980.0" y="84" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">Mirror họ A qua trục</text>
<text x="980.0" y="99" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ họ spiral ngược chiều</text>
<text x="980.0" y="114" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ 2 họ cắt nhau = ô lens</text>
<rect x="810" y="210" width="340" height="96" rx="9" fill="#FDF3E3" stroke="#c98b3a" stroke-width="1.6"/>
<text x="980.0" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="700" fill="#1f3a63">4 · Offset ô vào trong</text>
<text x="980.0" y="254" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">Clipper PolyOffset / Offset+Fillet</text>
<text x="980.0" y="269" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ khung gỗ mảnh + "con mắt"</text>
<text x="980.0" y="284" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">(đúng bước bạn vừa làm)</text>
<rect x="420" y="210" width="340" height="96" rx="9" fill="#EAF2FB" stroke="#4A78C8" stroke-width="1.6"/>
<text x="590.0" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="700" fill="#1f3a63">5 · Cắt biên + vành</text>
<text x="590.0" y="254" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">Trim with Region / Boundary</text>
<text x="590.0" y="269" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">giữ trong đĩa tròn, vành petal ngoài</text>
<text x="590.0" y="284" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">+ đục lỗ trục kim ở tâm</text>
<rect x="30" y="210" width="340" height="96" rx="9" fill="#EAF2FB" stroke="#4A78C8" stroke-width="1.6"/>
<text x="200.0" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="700" fill="#1f3a63">6 · Xuất gia công</text>
<text x="200.0" y="254" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">Bake → DXF/AI</text>
<text x="200.0" y="269" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">→ Laser cut gỗ walnut ~4mm</text>
<text x="200.0" y="284" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#456">+ lắp bộ máy đồng hồ</text>
<line x1="370" y1="88" x2="420" y2="88" stroke="#c98b3a" stroke-width="3"/><polygon points="420,88 411,83 411,93" fill="#c98b3a"/>
<line x1="760" y1="88" x2="810" y2="88" stroke="#c98b3a" stroke-width="3"/><polygon points="810,88 801,83 801,93" fill="#c98b3a"/>
<line x1="980" y1="136" x2="980" y2="210" stroke="#c98b3a" stroke-width="3"/><polygon points="980,210 989,205 989,215" fill="#c98b3a"/>
<line x1="810" y1="258" x2="760" y2="258" stroke="#c98b3a" stroke-width="3"/><polygon points="760,258 769,253 769,263" fill="#c98b3a"/>
<line x1="420" y1="258" x2="370" y2="258" stroke="#c98b3a" stroke-width="3"/><polygon points="370,258 379,253 379,263" fill="#c98b3a"/>
</svg>