<text x="16" y="366" font-family="Segoe UI" font-size="11" fill="#666">Boundary Surfaces (từ Circle) = đĩa → Brep | Curve (Brep = đĩa, Curve = Voronoi) cắt ô gọn trong vòng → Boundary Surfaces = MẶT CÁC Ô. Offset Curve (Distance = Negative của 0.126 = −0.126, co vào) → Fillet (0.342) → Boundary Surfaces (Flatten ↓, MẶT Ô + Fillet) = mặt KHUNG có lỗ. HAI Extrude khác nguồn: Extrude Unit Z × 0.3 đùn MẶT CÁC Ô (lớp đặc); Extrude Unit Z × 0.422 đùn MẶT KHUNG (lớp trên) → 2 lớp chồng. (Box / Deconstruct Brep / List Item trong file để RỜI, không nối tiếp.)</text>
