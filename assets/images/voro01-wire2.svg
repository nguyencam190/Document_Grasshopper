<text x="16" y="344" font-family="Segoe UI" font-size="11" fill="#666">Boundary Surfaces (từ Circle) = đĩa tròn → Brep | Curve (Brep = đĩa, Curve = Voronoi) cắt ô gọn trong vòng → Boundary Surfaces = mặt các ô. Offset Curve (Distance = Negative của 0.126 = −0.126, co vào) → Fillet (0.342) bo góc → Boundary Surfaces (Flatten ↓, mặt ngoài + Fillet) = mặt gỗ có lỗ → Extrude ×2 (Unit Z × 0.3 và × 0.422) = 2 lớp dày khác nhau. (Box / Deconstruct Brep / List Item trong file để RỜI, không nối tiếp.)</text>
